# ~/.tmux.conf
#
# Lightweight tmux configuration.
# No plugins, no external dependencies except optional status helpers.

# -----------------------------------------------------------------------------
# Prefix
# -----------------------------------------------------------------------------

unbind C-b

set -g prefix C-t
bind C-t next-window


# -----------------------------------------------------------------------------
# Terminal
# -----------------------------------------------------------------------------

# Prefer tmux's own 256-colour terminfo entry.
# If a host does not provide tmux-256color, change this back to "tmux".
set -g default-terminal "tmux-256color"

# Tell tmux about modern terminal capabilities where terminfo may be incomplete.
set -as terminal-features ',xterm*:RGB'

# Reduce the delay after Escape. Useful with vi copy-mode.
set -sg escape-time 10


# -----------------------------------------------------------------------------
# General
# -----------------------------------------------------------------------------

set -g base-index 1
setw -g pane-base-index 1

set -g mouse on

set -g history-limit 50000

setw -g mode-keys vi
setw -g automatic-rename off

# Keep window numbering compact after closing windows.
set -g renumber-windows on


# -----------------------------------------------------------------------------
# Status line
# -----------------------------------------------------------------------------

set -g status on
set -g status-interval 5

set -g status-left-length 30
set -g status-right-length 60

set -g status-style 'bg=black,fg=white'

set -g status-left \
    '#[fg=cyan,bold] #H #[fg=colour244]· #[fg=white]#S '

set -g status-right \
    '#[fg=magenta]#(load.sh) #[fg=colour244]| #[fg=blue]%Y/%m/%d %H:%M #[default]'

setw -g window-status-format \
    '#[fg=colour244] #I:#W#F '

setw -g window-status-current-format \
    '#[fg=green,bold] #I:#W#F '

set -g status-right \
    '#[fg=colour244]%a #[fg=blue]%Y/%m/%d %H:%M '

setw -g window-status-style \
    'fg=colour244,bg=black'

setw -g window-status-current-style \
    'fg=green,bg=black,bold'

set -g message-style \
    'fg=white,bg=red,bold'



# -----------------------------------------------------------------------------
# Panes
# -----------------------------------------------------------------------------

set -g pane-border-style \
    'fg=colour238'

set -g pane-active-border-style \
    'fg=cyan'

set -g display-panes-time 1000


# -----------------------------------------------------------------------------
# Key bindings
# -----------------------------------------------------------------------------

unbind l
unbind C-c

# Pass Ctrl-L through to the application.
bind -n C-l send-keys C-l

# Reload configuration.
bind C-r source-file ~/.tmux.conf \; display-message 'tmux.conf reloaded'

# New window in the current directory.
bind c new-window -c '#{pane_current_path}'

# Pane layout.
bind 1 break-pane
bind 2 split-window -v -c '#{pane_current_path}'
bind 3 split-window -h -c '#{pane_current_path}'

# Resize panes.
bind -r C-h resize-pane -L 6
bind -r C-l resize-pane -R 6
bind -r C-j resize-pane -D 3
bind -r C-k resize-pane -U 3

# Swap panes.
bind -r s swap-pane -U

# Pane/window management.
bind k kill-pane
bind K kill-window
bind i display-panes

# Copy/paste.
bind y copy-mode
bind p paste-buffer

